[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "money"
version = "0.1.0"
description = "Educational strategy-backtesting & learning lab for crypto and North-American equities. Backtest/paper only — never trades real money."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ccxt",
    "yfinance",
    "tradingview-ta",
    "backtesting",
    "pandas",
    "numpy",
    "pyarrow",
    "pyyaml",
    "alpaca-py",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
money = "trading.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
