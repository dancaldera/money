[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "money"
version = "0.1.0"
description = "Educational strategy-backtesting & learning lab for crypto and North-American equities. Backtest/paper only — never trades real money."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yfinance",
    "tradingview-ta",
    "backtesting",
    "pandas",
    "numpy",
    "pyarrow",
    "pyyaml",
    "alpaca-py",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
research = ["transformers>=4.40", "torch>=2.2"]

[project.scripts]
money = "trading.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.report]
# NOTE: setting exclude_lines replaces coverage's defaults, so the
# `# pragma: no cover` pattern must be repeated here explicitly.
exclude_lines = [
    "pragma: no cover",
    'if __name__ == "__main__":',
]
