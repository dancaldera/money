# Experiment manifest — NOT the live run.
#
# Question: the live desk's binding constraint is not the caps (the run3 scan
# census shows 8 buy signals -> 8 intents -> 0 blocked by any guard; 7/17 slots
# used, 44% of the $10,625 gross cap). Dollars come from trade count x
# deployment, so the untested lever is UNIVERSE BREADTH: do more symbols
# competing for the same 17 slots x $625 make more money, or do they only add
# marginal crosses that crowd out the good ones?
#
# Exactly the run3 basis (17 slots, $10,625 gross, opt-in halt recovery — the
# same values as exp-slots-all-recover) with a wider watchlist:
#   crypto + BCH/USD, UNI/USD (both have Alpaca daily history from 2022-01-01,
#     unlike XRP/USD (2024-), DOT/USD (2023-08-), SHIB/USD (2023-03-),
#     ADA/USD (2026-02-) which cannot price the whole window)
#     -> 10 crypto symbols (cap stays 8 positions / $5,000)
#   stocks + JPM, XOM, WMT, COST, UNH, V (non-tech sectors, full history)
#     -> 15 stock symbols (cap stays 9 positions / $5,625)
#
# Mechanism probe, not a candidate: the same 10-crypto watchlist with the crypto
# slot budget grown 8 -> 10 ($5,000 -> $6,250) so the newcomers do not have to
# take a slot from an incumbent. If the drag in exp-universe-wide-crypto is
# slot displacement, the crypto leg recovers here; if the added pairs simply do
# not pay, it does not.
#
# The strict loader (every live command) pins the archived 17-symbol watchlist,
# so this is read-only research: a wider live universe needs a new registered
# run_id, i.e. a human decision.
#
# Replay read-only with:
#   .venv/bin/money portfolio-backtest --run-config config/experiments/exp-universe-wide.yaml
