# Experiment manifest — NOT the live run.
#
# run3's basis (17 slots x $625 + halt recovery) with a breakeven stop: once a
# position closes at +10% or better, the stop moves up to entry, so a winner
# cannot round-trip all the way into the fixed -8% (the AMD case: +15.9% with
# the stop still 8% below entry, i.e. unprotected above it). Experiment-only
# knob; every live run pins it to absent.
#
# Replay read-only with:
#   .venv/bin/money portfolio-backtest --run-config config/experiments/exp-slots-all-breakeven10.yaml
run_id: exp-slots-all-breakeven10
starting_equity: 100000
strategy:
  name: sma_cross
  fast_window: 10
  slow_window: 30
  timeframe: 1d
  stop_loss_pct: 8
  require_fresh_cross_after_stop: true
  stop_breakeven_at_pct: 10
portfolio:
  position_notional: 625
  max_positions: 17
  max_gross_exposure: 10625
  max_crypto_positions: 8
  max_crypto_exposure: 5000
  max_stock_positions: 9
  max_stock_exposure: 5625
  correlation_window: 60
  correlation_threshold: 0.80
  correlation_matches_allowed: 1
  drawdown_halt_pct: 5
  halt_recovery_drawdown_pct: 2.5
  halt_recovery_days: 20
execution:
  stock_gap_limit_pct: 2
  crypto_gap_limit_pct: 3
  paper_only: true
  use_margin: false
  equity_slippage_bps: 5
  crypto_taker_fee_bps: 25
research:
  regime_min_score: 3
  feature_max_age_hours: 36
  news_lookback_days: 60
  news_min_observations: 30
  negative_news_z: 2.0
  sec_lookback_hours: 48
  sec_forms:
    - 8-K
    - 10-K
    - 10-Q
    - NT 10-K
    - NT 10-Q
    - S-3
    - 424B2
    - 424B3
    - 424B5
    - DEF 14A
  vix_percentile: 0.80
  volatility_percentile: 0.80
  model: ProsusAI/finbert
  model_revision: "4556d13015211d73dccd3fdd39d39232506f3e43"
  arms:
    - baseline
    - shadow_regime
    - shadow_regime_news
crypto:
  symbols:
    - BTC/USD
    - ETH/USD
    - SOL/USD
    - LTC/USD
    - LINK/USD
    - DOGE/USD
    - AVAX/USD
    - AAVE/USD
stocks:
  symbols:
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - GOOGL
    - META
    - TSLA
    - AMD
    - NFLX
