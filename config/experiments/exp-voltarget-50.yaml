# Experiment manifest — NOT the live run.
#
# exp-slots-all-recover (17 slots x $625, halt recovery) with risk-based
# position sizing at a 50% annualized volatility target. The frozen rule
# gives every slot the same $625 whatever the asset, so a crypto slot carries
# ~1.8x the volatility of a stock slot (measured mean rolling-60d vol over
# 2022-2026: crypto 88%, equities 49%). The knob scales each entry by
# clip(target/realized_vol, 0.25, 4) on the same frozen caps, so the book is
# sized by risk instead of by notional. Literatures: Moreira-Muir (2017),
# Harvey et al. (2018) — vol targeting improves Sharpe for risk assets.
#
# Replay read-only with:
#   .venv/bin/money portfolio-backtest --run-config config/experiments/exp-voltarget-50.yaml
run_id: exp-voltarget-50
starting_equity: 100000
strategy:
  name: sma_cross
  fast_window: 10
  slow_window: 30
  timeframe: 1d
  stop_loss_pct: 8
  require_fresh_cross_after_stop: true
portfolio:
  position_notional: 625
  max_positions: 17
  max_gross_exposure: 10625
  max_crypto_positions: 8
  max_crypto_exposure: 5000
  max_stock_positions: 9
  max_stock_exposure: 5625
  correlation_window: 60
  correlation_threshold: 0.80
  correlation_matches_allowed: 1
  drawdown_halt_pct: 5
  # The day cooldown is what actually fires: a halted desk is flat, so its
  # equity cannot rise and the drawdown-only branch never trips alone.
  halt_recovery_drawdown_pct: 2.5
  halt_recovery_days: 20
  # Experiment-only risk-based sizing (run2/sizing.py): entry notional =
  # position_notional * clip(50/realized_vol, 0.25, 4). Realized vol is
  # the annualized stdev of the last 60 daily returns up to the signal bar.
  position_vol_target_pct: 50
  position_vol_window: 60
execution:
  stock_gap_limit_pct: 2
  crypto_gap_limit_pct: 3
  paper_only: true
  use_margin: false
  equity_slippage_bps: 5
  crypto_taker_fee_bps: 25
research:
  regime_min_score: 3
  feature_max_age_hours: 36
  news_lookback_days: 60
  news_min_observations: 30
  negative_news_z: 2.0
  sec_lookback_hours: 48
  sec_forms:
    - 8-K
    - 10-K
    - 10-Q
    - NT 10-K
    - NT 10-Q
    - S-3
    - 424B2
    - 424B3
    - 424B5
    - DEF 14A
  vix_percentile: 0.80
  volatility_percentile: 0.80
  model: ProsusAI/finbert
  model_revision: "4556d13015211d73dccd3fdd39d39232506f3e43"
  arms:
    - baseline
    - shadow_regime
    - shadow_regime_news
crypto:
  symbols:
    - BTC/USD
    - ETH/USD
    - SOL/USD
    - LTC/USD
    - LINK/USD
    - DOGE/USD
    - AVAX/USD
    - AAVE/USD
stocks:
  symbols:
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - GOOGL
    - META
    - TSLA
    - AMD
    - NFLX
