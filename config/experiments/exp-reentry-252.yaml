# Experiment manifest — NOT the live run.
#
# exp-reentry-252: the run3 basis (17 slots x $625, 8% stop, opt-in halt
# recovery) with ONE change — `stop_reentry_bars: 252`. After a protective stop
# the frozen gate demands a fresh up-cross (`require_fresh_cross_after_stop:
# true`), so a position stopped inside an intact up-trend is simply sat out until
# a new cross appears. With the knob set, a symbol stopped out may be re-entered
# within the next 252 of its own sessions while the fast SMA is still above the
# slow SMA; every guard, the gap cap and the fill-derived stop are unchanged.
#
# Replay read-only with:
#   .venv/bin/money portfolio-backtest --run-config config/experiments/exp-reentry-252.yaml
run_id: exp-reentry-252
starting_equity: 100000
strategy:
  name: sma_cross
  fast_window: 10
  slow_window: 30
  timeframe: 1d
  stop_loss_pct: 8
  require_fresh_cross_after_stop: true
  stop_reentry_bars: 252
portfolio:
  position_notional: 625
  max_positions: 17
  max_gross_exposure: 10625
  max_crypto_positions: 8
  max_crypto_exposure: 5000
  max_stock_positions: 9
  max_stock_exposure: 5625
  correlation_window: 60
  correlation_threshold: 0.8
  correlation_matches_allowed: 1
  drawdown_halt_pct: 5
  halt_recovery_drawdown_pct: 2.5
  halt_recovery_days: 20
execution:
  stock_gap_limit_pct: 2
  crypto_gap_limit_pct: 3
  paper_only: true
  use_margin: false
  equity_slippage_bps: 5
  crypto_taker_fee_bps: 25
research:
  regime_min_score: 3
  feature_max_age_hours: 36
  news_lookback_days: 60
  news_min_observations: 30
  negative_news_z: 2.0
  sec_lookback_hours: 48
  sec_forms:
  - 8-K
  - 10-K
  - 10-Q
  - NT 10-K
  - NT 10-Q
  - S-3
  - 424B2
  - 424B3
  - 424B5
  - DEF 14A
  vix_percentile: 0.8
  volatility_percentile: 0.8
  model: ProsusAI/finbert
  model_revision: 4556d13015211d73dccd3fdd39d39232506f3e43
  arms:
  - baseline
  - shadow_regime
  - shadow_regime_news
crypto:
