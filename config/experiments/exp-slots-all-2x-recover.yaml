# Experiment manifest — NOT the live run.
#
# exp-slots-all-2x (17 slots x $1,250 = $21,250 gross) PLUS the opt-in halt
# recovery that the live run3 carries (2.5% drawdown or 20 calendar days).
# The unmeasured row of the run3 ladder: exp-slots-all-2x only shows what the
# one-way 5% latch does at this size (-4.47%, frozen at trade 70), which says
# nothing about a desk that can resume. This is the row that prices the next
# honest step up from run3's $625 slots.
#
# Replay read-only with:
#   .venv/bin/money portfolio-backtest --run-config config/experiments/exp-slots-all-2x-recover.yaml
run_id: exp-slots-all-2x-recover
starting_equity: 100000
strategy:
  name: sma_cross
  fast_window: 10
  slow_window: 30
  timeframe: 1d
  stop_loss_pct: 8
  require_fresh_cross_after_stop: true
portfolio:
  position_notional: 1250
  max_positions: 17
  max_gross_exposure: 21250
  max_crypto_positions: 8
  max_crypto_exposure: 10000
  max_stock_positions: 9
  max_stock_exposure: 11250
  correlation_window: 60
  correlation_threshold: 0.80
  correlation_matches_allowed: 1
  drawdown_halt_pct: 5
  # Same insurance as run3: the calendar cooldown is the branch that fires,
  # because a halted desk is flat and its drawdown cannot fall back on its own.
  halt_recovery_drawdown_pct: 2.5
  halt_recovery_days: 20
execution:
  stock_gap_limit_pct: 2
  crypto_gap_limit_pct: 3
  paper_only: true
  use_margin: false
  equity_slippage_bps: 5
  crypto_taker_fee_bps: 25
research:
  regime_min_score: 3
  feature_max_age_hours: 36
  news_lookback_days: 60
  news_min_observations: 30
  negative_news_z: 2.0
  sec_lookback_hours: 48
  sec_forms:
    - 8-K
    - 10-K
    - 10-Q
    - NT 10-K
    - NT 10-Q
    - S-3
    - 424B2
    - 424B3
    - 424B5
    - DEF 14A
  vix_percentile: 0.80
  volatility_percentile: 0.80
  model: ProsusAI/finbert
  model_revision: "4556d13015211d73dccd3fdd39d39232506f3e43"
  arms:
    - baseline
    - shadow_regime
    - shadow_regime_news
crypto:
  symbols:
    - BTC/USD
    - ETH/USD
    - SOL/USD
    - LTC/USD
    - LINK/USD
    - DOGE/USD
    - AVAX/USD
    - AAVE/USD
stocks:
  symbols:
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - GOOGL
    - META
    - TSLA
    - AMD
    - NFLX
