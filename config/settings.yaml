# Watchlists and backtest defaults.
# Edit freely — the CLI reads these for the `scan` command and for defaults.

defaults:
  timeframe: "1d"        # "1d" or "1h"
  since: "2022-01-01"    # backtest start date (YYYY-MM-DD)
  cash: 10000            # starting capital (fake money)
  commission: 0.002      # 0.2% per trade

# Crypto symbols use BASE/QUOTE notation; OHLCV comes from yfinance
# (BTC/USD -> BTC-USD), which has deep daily history back to inception.
crypto:
  symbols:
    - "BTC/USD"
    - "ETH/USD"
    - "SOL/USD"
    - "LTC/USD"
    - "LINK/USD"
    - "DOGE/USD"
    - "AVAX/USD"
    - "AAVE/USD"

# North-American equities (NASDAQ / NYSE tickers).
stocks:
  symbols:
    - "AAPL"
    - "MSFT"
    - "NVDA"
    - "AMZN"
    - "GOOGL"
    - "META"
    - "TSLA"
    - "AMD"
    - "NFLX"

# Paper trading (Alpaca paper account — fake money, never live).
paper:
  notional: 1000          # dollars committed per new position
  stop_loss_pct: 8        # close a position if it falls this many % below entry (0 = off)
